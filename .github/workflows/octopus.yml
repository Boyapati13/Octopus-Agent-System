name: Octopus Agent Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    types: [opened, synchronize]

# Don't cancel in-progress runs — they may be writing synthesised agent files
concurrency:
  group: octopus-${{ github.ref }}
  cancel-in-progress: false

jobs:
  octopus:
    name: Octopus Agent Chain
    runs-on: ubuntu-latest

    permissions:
      contents: write       # auto-commit synthesised skills/agents
      pull-requests: write  # post pipeline summaries as PR comments

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2          # need HEAD~1 for changed-files diff

      # ── Runtimes ────────────────────────────────────────────────────────────
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: node/package-lock.json

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # ── Dependencies ────────────────────────────────────────────────────────
      - name: Install Python dependencies
        run: pip install -r python/requirements.txt

      - name: Install Node dependencies
        run: cd node && npm ci

      # ── Memory service ──────────────────────────────────────────────────────
      - name: Create data directory
        run: mkdir -p data

      - name: Start memory service
        run: |
          python python/services/memory_service.py &
          echo "Waiting for memory service…"
          for i in $(seq 1 20); do
            curl -sf http://localhost:5000/health > /dev/null && echo "Ready after ${i}s" && break
            sleep 1
          done
        env:
          OCTOPUS_DB: ./data/octopus.db

      - name: Index repository
        run: python python/indexer/index_repo.py --root . --db ./data/octopus.db
        continue-on-error: true   # non-fatal: agents still work without index

      # ── Tests ───────────────────────────────────────────────────────────────
      - name: Run test suite
        run: cd node && npm test
        env:
          # Tests are mocked — no real API key needed, but set to avoid env errors
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'test' }}

      # ── Agent pipeline ──────────────────────────────────────────────────────
      - name: Run Octopus agent pipeline
        id: pipeline
        run: node scripts/octopus_push_handler.js
        env:
          # Provider — set LLM_PROVIDER in repo Variables, key in Secrets
          LLM_PROVIDER:       ${{ vars.LLM_PROVIDER || 'anthropic' }}
          LLM_MODEL:          ${{ vars.LLM_MODEL || '' }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY:     ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY:     ${{ secrets.GOOGLE_API_KEY }}
          OLLAMA_BASE_URL:    ${{ vars.OLLAMA_BASE_URL || '' }}
          # GitHub token — auto-provided; add GITHUB_TOKEN secret for higher rate limits
          GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
          MEMORY_SERVICE_URL: http://localhost:5000
          DATA_DIR:           ./data
          SAFE_MODE:          'false'
          GIT_COMMIT_MSG:     ${{ github.event.head_commit.message || github.event.pull_request.title }}
        # Gate failures are warnings — don't fail the CI check
        continue-on-error: true

      # ── Auto-commit synthesised output ──────────────────────────────────────
      - name: Commit synthesised skills and auto-generated agents
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git add \
            node/skills/auto_generated/ \
            node/src/agents/ \
            data/skill_registry.json 2>/dev/null || true
          git diff --cached --quiet \
            || git commit -m "chore(octopus): auto-synthesised skills and agents [skip ci]"
          git push
        continue-on-error: true   # non-fatal if nothing to commit
