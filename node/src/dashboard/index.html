<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Octopus Dashboard</title>
    <style>
        :root {
            --bg: #eff2f7;
            --surface: #ffffff;
            --surface-soft: #f8fafc;
            --text: #1f2937;
            --muted: #64748b;
            --line: #dbe3ee;
            --brand: #2f8fd6;
            --brand-soft: #e5f1fb;
            --ok: #16a34a;
            --warn: #ca8a04;
            --danger: #dc2626;
            --shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
        }

        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
        }

        button, textarea { font: inherit; }
        button { cursor: pointer; }

        .shell {
            height: 100%;
            display: grid;
            grid-template-rows: auto 1fr auto;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            border-bottom: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(6px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #526276;
            font-size: 36px;
            font-weight: 300;
            letter-spacing: 0.01em;
        }

        .brand-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--brand);
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 10px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: var(--surface);
            color: var(--muted);
            font-size: 12px;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #94a3b8;
        }

        .dot.live { background: var(--brand); animation: pulse 1.3s infinite; }
        .dot.ok { background: var(--ok); }
        .dot.warn { background: var(--warn); }
        .dot.bad { background: var(--danger); }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.6; }
        }

        .toggle-btn {
            border: 1px solid var(--line);
            background: var(--surface);
            color: #516075;
            border-radius: 10px;
            width: 38px;
            height: 38px;
        }

        .main {
            overflow: auto;
            padding: 26px;
            display: grid;
            gap: 18px;
            align-content: start;
            max-width: 980px;
            margin: 0 auto;
            width: 100%;
        }

        .answer-box {
            border-radius: 16px;
            border: 1px solid var(--line);
            background: var(--surface);
            box-shadow: var(--shadow);
            padding: 22px;
            min-height: 170px;
            display: grid;
            gap: 10px;
        }

        .answer-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .answer-state {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--muted);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .answer-text {
            font-size: 24px;
            line-height: 1.5;
            color: #2a3a4f;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .conversation {
            border-radius: 14px;
            border: 1px solid var(--line);
            background: var(--surface-soft);
            padding: 14px;
            display: grid;
            gap: 10px;
            min-height: 220px;
            max-height: 340px;
            overflow: auto;
        }

        .msg {
            border-radius: 12px;
            border: 1px solid #d7e1ee;
            background: var(--surface);
            padding: 10px 12px;
            display: grid;
            gap: 5px;
        }

        .msg.user { border-color: #cde3f7; }
        .msg.assistant { border-color: #dbeadf; }

        .msg-role {
            font-size: 11px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 600;
        }

        .msg-text {
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
            color: var(--text);
        }

        .composer {
            border-top: 1px solid var(--line);
            background: #f8fbff;
            padding: 14px 20px 18px;
            display: grid;
            gap: 10px;
        }

        .task-input {
            width: 100%;
            min-height: 56px;
            max-height: 140px;
            resize: vertical;
            border-radius: 12px;
            border: 1px solid #cfd9e8;
            background: #ffffff;
            padding: 11px 12px;
            color: var(--text);
            outline: none;
        }

        .task-input:focus { border-color: #8ec1ea; }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            border-radius: 10px;
            border: 1px solid transparent;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: 600;
        }

        .btn.primary {
            background: linear-gradient(135deg, #65b2eb, #2f8fd6);
            color: #ffffff;
        }

        .btn.secondary {
            background: #ffffff;
            color: #344256;
            border-color: #d3deed;
        }

        .btn.alert {
            background: #fff1f2;
            color: #9f1239;
            border-color: #fecdd3;
        }

        .drawer {
            position: fixed;
            right: 0;
            top: 0;
            width: 360px;
            height: 100%;
            border-left: 1px solid var(--line);
            background: var(--surface);
            transform: translateX(100%);
            transition: transform 0.24s ease;
            box-shadow: -10px 0 24px rgba(15, 23, 42, 0.08);
            z-index: 10;
            display: grid;
            grid-template-rows: auto 1fr;
        }

        .drawer.open { transform: translateX(0); }

        .drawer-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--line);
            padding: 14px;
        }

        .drawer-title {
            margin: 0;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
        }

        .drawer-body {
            overflow: auto;
            padding: 12px 14px 20px;
            display: grid;
            gap: 14px;
            align-content: start;
        }

        .card {
            border: 1px solid #dce6f3;
            border-radius: 12px;
            background: #fafcff;
            padding: 10px;
            display: grid;
            gap: 6px;
        }

        .card-title {
            font-size: 11px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 700;
        }

        .mono {
            font-family: Consolas, "Cascadia Mono", monospace;
            font-size: 12px;
            color: #35465b;
            word-break: break-all;
        }

        .event {
            border-top: 1px solid #e4edf8;
            padding-top: 6px;
            font-size: 12px;
            color: #465970;
            line-height: 1.45;
            white-space: pre-wrap;
            word-break: break-word;
        }

        @media (max-width: 900px) {
            .main { padding: 16px; }
            .answer-text { font-size: 20px; }
            .drawer { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="shell">
        <header class="topbar">
            <div class="brand"><span class="brand-dot"></span>Octopus</div>
            <div class="top-actions">
                <div class="status-pill"><span class="dot" id="ws-dot"></span><span id="ws-label">Connecting</span></div>
                <div class="status-pill"><span class="dot" id="run-dot"></span><span id="run-label">Idle</span></div>
                <button class="toggle-btn" id="drawer-toggle" aria-label="Toggle details">≡</button>
            </div>
        </header>

        <main class="main">
            <section class="answer-box">
                <div class="answer-head">
                    <div class="answer-state"><span class="dot" id="answer-dot"></span><span id="answer-state">ready</span></div>
                    <div id="project-label" class="status-pill">Project: none</div>
                </div>
                <div id="answer" class="answer-text">No answer yet. Type a command below and run it.</div>
            </section>

            <section id="conversation" class="conversation">
                <div class="msg"><div class="msg-role">system</div><div class="msg-text">Conversation will appear here.</div></div>
            </section>
        </main>

        <section class="composer">
            <textarea id="task-input" class="task-input" placeholder="Try: summarize README, inspect project files, or run a coding task"></textarea>
            <div class="actions">
                <button id="run-btn" class="btn primary">Run Command</button>
                <button id="voice-btn" class="btn secondary">Voice Input</button>
                <button id="stop-voice-btn" class="btn secondary">Stop Voice</button>
                <button id="interrupt-btn" class="btn alert">Interrupt</button>
            </div>
        </section>
    </div>

    <aside id="drawer" class="drawer" aria-label="Details Drawer">
        <div class="drawer-head">
            <h2 class="drawer-title">Details</h2>
            <button class="toggle-btn" id="drawer-close" aria-label="Close details">X</button>
        </div>
        <div class="drawer-body">
            <div class="card">
                <div class="card-title">Browser Context</div>
                <div id="ctx-url" class="mono">URL: -</div>
                <div id="ctx-title" class="mono">Title: -</div>
                <div id="ctx-status" class="mono">Status: idle</div>
            </div>
            <div class="card">
                <div class="card-title">Last Events</div>
                <div id="events"></div>
            </div>
        </div>
    </aside>

    <script>
        const API = "";
        const state = {
            ws: null,
            activeProjectId: null,
            messages: [],
            answer: "No answer yet. Type a command below and run it.",
            running: false,
            listening: false,
            speaking: false,
            recognizer: null,
            lastSpokenAnswer: "",
            lastEvents: [],
            browser: {
                url: "-",
                title: "-",
                status: "idle",
            },
        };

        const el = {
            answer: document.getElementById("answer"),
            answerDot: document.getElementById("answer-dot"),
            answerState: document.getElementById("answer-state"),
            wsDot: document.getElementById("ws-dot"),
            wsLabel: document.getElementById("ws-label"),
            runDot: document.getElementById("run-dot"),
            runLabel: document.getElementById("run-label"),
            projectLabel: document.getElementById("project-label"),
            conversation: document.getElementById("conversation"),
            taskInput: document.getElementById("task-input"),
            runBtn: document.getElementById("run-btn"),
            voiceBtn: document.getElementById("voice-btn"),
            stopVoiceBtn: document.getElementById("stop-voice-btn"),
            interruptBtn: document.getElementById("interrupt-btn"),
            drawer: document.getElementById("drawer"),
            drawerToggle: document.getElementById("drawer-toggle"),
            drawerClose: document.getElementById("drawer-close"),
            events: document.getElementById("events"),
            ctxUrl: document.getElementById("ctx-url"),
            ctxTitle: document.getElementById("ctx-title"),
            ctxStatus: document.getElementById("ctx-status"),
        };

        function escapeHtml(value) {
            return String(value || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/\"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function addMessage(role, text) {
            state.messages.push({ role: role, text: text });
            state.messages = state.messages.slice(-80);
            renderConversation();
        }

        function renderConversation() {
            if (!state.messages.length) {
                el.conversation.innerHTML = '<div class="msg"><div class="msg-role">system</div><div class="msg-text">Conversation will appear here.</div></div>';
                return;
            }
            el.conversation.innerHTML = state.messages.map(function (m) {
                return '<div class="msg ' + escapeHtml(m.role) + '"><div class="msg-role">' +
                    escapeHtml(m.role) +
                    '</div><div class="msg-text">' +
                    escapeHtml(m.text) +
                    '</div></div>';
            }).join("");
            el.conversation.scrollTop = el.conversation.scrollHeight;
        }

        function renderAnswer() {
            el.answer.textContent = state.answer;
            const running = state.running;
            el.answerState.textContent = running ? "running" : "ready";
            el.answerDot.className = "dot " + (running ? "live" : "ok");
            el.runDot.className = "dot " + (running ? "live" : "ok");
            el.runLabel.textContent = running ? "Running" : "Idle";
        }

        function renderDetails() {
            el.projectLabel.textContent = "Project: " + (state.activeProjectId || "none");
            el.ctxUrl.textContent = "URL: " + (state.browser.url || "-");
            el.ctxTitle.textContent = "Title: " + (state.browser.title || "-");
            el.ctxStatus.textContent = "Status: " + (state.browser.status || "idle");
            el.events.innerHTML = state.lastEvents.map(function (item) {
                return '<div class="event"><strong>' + escapeHtml(item.type) + '</strong><br>' + escapeHtml(item.summary) + '</div>';
            }).join("");
        }

        function logEvent(type, payload) {
            const summary = payload && (payload.summary || payload.reason || payload.task || payload.text || payload.answer || payload.output)
                ? String(payload.summary || payload.reason || payload.task || payload.text || payload.answer || payload.output)
                : JSON.stringify(payload || {});
            state.lastEvents.unshift({ type: type, summary: summary.slice(0, 180) });
            state.lastEvents = state.lastEvents.slice(0, 25);
            renderDetails();
        }

        function speak(text) {
            if (!text || !window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            state.speaking = true;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            utterance.onend = function () {
                state.speaking = false;
            };
            window.speechSynthesis.speak(utterance);
        }

        function maybeSpeakFinalAnswer(answer) {
            const normalized = String(answer || "").trim();
            if (!normalized) return;
            if (normalized === state.lastSpokenAnswer) return;
            state.lastSpokenAnswer = normalized;
            speak(normalized);
        }

        function setWsState(kind, text) {
            el.wsDot.className = "dot " + kind;
            el.wsLabel.textContent = text;
        }

        function connectWs() {
            const protocol = location.protocol === "https:" ? "wss" : "ws";
            const ws = new WebSocket(protocol + "://" + location.host + "/ws");
            state.ws = ws;
            setWsState("live", "Connecting");

            ws.onopen = function () {
                setWsState("ok", "Connected");
            };

            ws.onclose = function () {
                setWsState("bad", "Offline");
                setTimeout(connectWs, 1800);
            };

            ws.onerror = function () {
                ws.close();
            };

            ws.onmessage = function (event) {
                let parsed;
                try {
                    parsed = JSON.parse(event.data);
                } catch (_) {
                    return;
                }
                const type = parsed.type || "event";
                const data = parsed.data || {};
                logEvent(type, data);

                if (data.project_id && !state.activeProjectId) {
                    state.activeProjectId = data.project_id;
                }

                if (type === "chain_start") {
                    state.running = true;
                    state.answer = "Working...";
                    renderAnswer();
                }

                if (type === "voice_summary") {
                    const summary = data.summary || "";
                    if (summary) {
                        state.answer = summary;
                        state.running = false;
                        addMessage("assistant", summary);
                        renderAnswer();
                        maybeSpeakFinalAnswer(summary);
                    }
                }

                if (type === "project_updated" && data.project) {
                    const project = data.project;
                    state.activeProjectId = project.id || state.activeProjectId;
                    if (project.answer) {
                        state.answer = project.answer;
                    }
                    state.running = project.status === "running" || project.answer_status === "running";
                    if (project.answer_status === "done" && project.answer) {
                        maybeSpeakFinalAnswer(project.answer);
                    }
                    renderAnswer();
                    renderDetails();
                }

                if (type === "browser_context_updated") {
                    state.browser.url = data.url || state.browser.url;
                    state.browser.title = data.title || state.browser.title;
                    state.browser.status = data.status || "active";
                    renderDetails();
                }

                if (type === "chain_done") {
                    state.running = false;
                    renderAnswer();
                }
            };
        }

        async function apiFetch(path, options) {
            const response = await fetch(path, options || {});
            const text = await response.text();
            const body = text ? JSON.parse(text) : {};
            if (!response.ok) {
                throw new Error(body.error || response.statusText || "Request failed");
            }
            return body;
        }

        async function resolveProjectId() {
            try {
                const body = await apiFetch(API + "/api/projects");
                if (Array.isArray(body.projects) && body.projects.length) {
                    state.activeProjectId = body.active_project_id || body.projects[0].id;
                    renderDetails();
                }
            } catch (_) {
                // Keep working even if project listing is unavailable.
            }
        }

        async function runTask(text, viaVoice) {
            const trimmed = String(text || "").trim();
            if (!trimmed) return;

            state.running = true;
            addMessage(viaVoice ? "voice" : "user", trimmed);
            state.answer = "Working...";
            renderAnswer();

            const payload = viaVoice
                ? { text: trimmed, project_id: state.activeProjectId }
                : { task: trimmed, project_id: state.activeProjectId };

            try {
                await apiFetch(API + (viaVoice ? "/api/tasks/voice" : "/api/tasks/run"), {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload),
                });
            } catch (error) {
                state.running = false;
                state.answer = "Task failed: " + error.message;
                addMessage("assistant", state.answer);
                renderAnswer();
            }
        }

        function startVoiceInput() {
            const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!Recognition) {
                state.answer = "Voice input is not available in this browser.";
                renderAnswer();
                return;
            }
            if (state.listening) return;

            const recognizer = new Recognition();
            state.recognizer = recognizer;
            state.listening = true;
            el.voiceBtn.textContent = "Listening...";
            recognizer.continuous = false;
            recognizer.interimResults = true;
            recognizer.lang = "en-US";

            let transcript = "";
            recognizer.onresult = function (event) {
                transcript = Array.from(event.results).map(function (r) { return r[0].transcript; }).join(" ").trim();
            };

            recognizer.onerror = function () {
                state.listening = false;
                el.voiceBtn.textContent = "Voice Input";
            };

            recognizer.onend = function () {
                state.listening = false;
                el.voiceBtn.textContent = "Voice Input";
                if (transcript) {
                    runTask(transcript, true);
                }
            };

            recognizer.start();
        }

        function stopVoice() {
            if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
            }
            if (state.recognizer) {
                try {
                    state.recognizer.stop();
                } catch (_) {}
            }
            state.listening = false;
            state.speaking = false;
            el.voiceBtn.textContent = "Voice Input";
        }

        async function interruptTask() {
            try {
                await apiFetch(API + "/api/tasks/interrupt", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({}),
                });
                state.running = false;
                state.answer = "Task interrupted.";
                renderAnswer();
            } catch (error) {
                state.answer = "Interrupt failed: " + error.message;
                renderAnswer();
            }
        }

        function wireUi() {
            el.drawerToggle.addEventListener("click", function () {
                el.drawer.classList.toggle("open");
            });
            el.drawerClose.addEventListener("click", function () {
                el.drawer.classList.remove("open");
            });

            el.runBtn.addEventListener("click", function () {
                const text = el.taskInput.value;
                el.taskInput.value = "";
                runTask(text, false);
            });

            el.taskInput.addEventListener("keydown", function (event) {
                if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) {
                    event.preventDefault();
                    const text = el.taskInput.value;
                    el.taskInput.value = "";
                    runTask(text, false);
                }
            });

            el.voiceBtn.addEventListener("click", startVoiceInput);
            el.stopVoiceBtn.addEventListener("click", stopVoice);
            el.interruptBtn.addEventListener("click", interruptTask);
        }

        async function bootstrap() {
            wireUi();
            renderConversation();
            renderAnswer();
            renderDetails();
            await resolveProjectId();
            connectWs();
            el.taskInput.focus();
        }

        bootstrap();
    </script>
</body>
</html>
